epic: e06
title: Algorithm & Plugin Unification
description: >
  Eliminate dual release notes generators, split the 8-method Plugin
  interface into capability interfaces, and fix the AnalyzeCommits
  aggregation bug (last-wins instead of priority-based).
status: planning
priority: P1
bcps: 8

out_of_scope:
  - Context god-object split (deferred to e07)
  - New plugin types

stories:
  - id: e06s01
    title: Unify release notes generation
    description: >
      Delete ChangelogPlugin.GenerateNotes local implementation. Expand
      algorithm.Generator to group all 8 commit types (feat, fix, perf,
      docs, refactor, chore, style, test). ChangelogPlugin.GenerateNotes
      delegates to ctx.NextRelease.Notes. One generator, one grouping
      strategy.
    status: todo
    files:
      - internal/algorithm/generator.go
      - internal/algorithm/generator_test.go
      - internal/plugins/changelog.go
      - internal/plugins/changelog_test.go

  - id: e06s02
    title: Split Plugin interface into capability interfaces
    description: >
      Replace the 8-method Plugin interface with 7 capability interfaces:
      ConditionVerifier, CommitAnalyzer, ReleaseVerifier, NotesGenerator,
      Preparer, Publisher, LifecycleHook. Orchestrator type-asserts per
      phase. Plugins implement only what they need.
    status: todo
    files:
      - internal/plugins/registry.go
      - internal/plugins/git.go
      - internal/plugins/github.go
      - internal/plugins/changelog.go
      - internal/plugins/exec.go
      - pkg/release/release.go

  - id: e06s03
    title: Fix AnalyzeCommits aggregation (priority-based)
    description: >
      Orchestrator currently takes last non-empty release type from plugins.
      If changelog returns patch after git returns minor, result is patch
      (wrong). Fix: use priority-based aggregation (major > minor > patch),
      same as algorithm.Analyzer.
    status: todo
    files:
      - pkg/release/release.go
      - pkg/release/release_test.go

verification:
  - step: All tests pass
    command: make test
    expected: All tests pass

  - step: Build binary
    command: make build
    expected: Binary exists in bin/big-release

  - step: Lint
    command: make lint
    expected: No lint errors
