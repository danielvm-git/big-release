epic: e07
title: Context Discipline
description: >
  Split the mutable Context god-object into ReadOnlyContext (immutable
  input) and MutableState (write targets owned by specific stages).
  Enforces mutation discipline across the pipeline.
status: planning
priority: P2
bcps: 5

out_of_scope:
  - Full pipeline rewrite (incremental split only)
  - New lifecycle phases

stories:
  - id: e07s01
    title: Split Context into ReadOnlyContext and MutableState
    description: >
      ReadOnlyContext holds Config, Branch, Commits, Releases,
      RepositoryURL, DryRun (immutable after construction). MutableState
      holds LastRelease, NextRelease, Notes, Assets (written by specific
      stages). Plugins receive ReadOnlyContext plus MutableState pointer.
      Calculator writes NextRelease, Generator writes Notes, plugins
      write Assets.
    status: todo
    files:
      - internal/algorithm/types.go
      - pkg/release/release.go
      - internal/plugins/git.go
      - internal/plugins/github.go
      - internal/plugins/changelog.go
      - internal/plugins/exec.go
      - internal/algorithm/calculator.go
      - internal/algorithm/generator.go

verification:
  - step: All tests pass
    command: make test
    expected: All tests pass

  - step: Build binary
    command: make build
    expected: Binary exists in bin/big-release

  - step: Lint
