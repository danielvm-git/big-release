epic: e19
title: GitHub Publisher
description: >
  Add GitHub release features parity with @semantic-release/github:
  binary asset uploads (#10), draft releases (#13), configurable release
  name/body templates (#11), and issue/PR commenting after release (#12).
  Foundation: e19s01 introduces plugin config plumbing and capture of the
  release ID from the 201 response (needed by subsequent stories).
status: planning
priority: P2
bcps: 12

out_of_scope:
  - Non-GitHub publishers (npm/pypi/crates) — those are package publishers
  - GitLab asset uploads (GitHub only for now)
  - Auto-generated release notes via GitHub (already supported as fallback)

stories:
  - id: e19s01
    title: Upload binary assets to GitHub releases (#10)
    description: >
      Introduce plugin config (GitHubConfig in algorithm.Config).
      Capture release ID from 201 response (currently discarded).
      Upload step: POST uploads.github.com/.../assets per asset, MIME by
      extension, glob expansion, {path,label} entries. Missing files
      warn (non-fatal). Dry-run skips. Populate Release.Assets.
    status: todo
    files:
      - internal/algorithm/types.go
      - internal/config/config.go
      - internal/plugins/github.go
      - internal/plugins/github_test.go

  - id: e19s02
    title: Support draft GitHub releases (#13)
    description: >
      Add Draft bool to createReleaseRequest. draftRelease:true creates as
      draft. After assets uploaded, PATCH release to draft:false. Builds on
      e19s01 release-ID + response handling.
    status: todo
    files:
      - internal/plugins/github.go
      - internal/plugins/github_test.go

  - id: e19s03
    title: Configurable release name and body templates (#11)
    description: >
      Replace hardcoded Name: "v"+version with text/template in
      buildReleasePayload. Context vars: version, date, branch, notes,
      lastRelease, nextRelease. Default preserves v{version}.
    status: todo
    files:
      - internal/plugins/github.go
      - internal/plugins/github_test.go

  - id: e19s04
    title: Comment on resolved issues/PRs after release (#12)
    description: >
      Implement Success() hook (currently no-op). Parse
      fixes|closes|resolves #N from release commits. Find associated PRs.
      POST issue comments with configurable successComment. Optional
      releasedLabels. 403/404 non-fatal. Dry-run skips.
    status: todo
    files:
      - internal/plugins/github.go
      - internal/plugins/github_test.go

verification:
  - step: All tests pass
    command: make test
    expected: All tests pass

  - step: Build binary
    command: make build
    expected: Binary exists in bin/big-release

  - step: Lint
    command: make lint
    expected: No lint errors

  - step: Preflight
    command: make preflight
    expected: Preflight green
