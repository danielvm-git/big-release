epic: e05
title: Publisher & Git Hardening
description: >
  Extract shared HTTP retry logic from 6 publishers, define a GitAPI
  interface for testability, and unify the two parallel git execution
  paths (git.Client vs GitPlugin.gitCommand).
status: done
priority: P1
bcps: 8

out_of_scope:
  - Publisher installer packages (separate initiative)
  - Cross-platform binary distribution

stories:
  - id: e05s01
    title: Extract shared HTTP retry client
    description: >
      Create internal/publishers/httputil/retry.go with RetryClient that
      wraps http.Client with exponential backoff (maxRetries=3, retryBase=1s)
      and standard error mapping (401 to ErrUnauthorized, 403 to ErrForbidden,
      429 to retry, 500+ to ErrServerError). Replace inline retry loops in
      pypi, crates, goproxy, maven, packagist, godot publishers.
    status: done
    files:
      - internal/publishers/httputil/retry.go
      - internal/publishers/httputil/errors.go
      - internal/publishers/pypi/pypi.go
      - internal/publishers/crates/crates.go
      - internal/publishers/goproxy/goproxy.go
      - internal/publishers/maven/maven.go
      - internal/publishers/packagist/packagist.go
      - internal/publishers/godot/godot.go

  - id: e05s02
    title: Define GitAPI interface
    description: >
      Create internal/git/api.go with GitAPI interface covering the 8
      methods the orchestrator needs (GetCommits, GetTags, GetTagHead,
      GetHead, GetLastRelease, GetRepositoryURL, GetCurrentBranch,
      IsGitRepo). Change release.Context.Git from *git.Client to GitAPI.
      Add fakeGit test implementation for orchestrator unit tests.
    status: done
    files:
      - internal/git/api.go
      - internal/git/client.go
      - pkg/release/release.go
      - pkg/release/release_test.go

  - id: e05s03
    title: Unify git execution paths
    description: >
      GitPlugin drops its gitCommand helper and uses the GitAPI interface
      from e05s02. Constructor receives GitAPI instead of creating its own
      exec.Command. Tag semantics unified to git tag -a.
    status: done
    files:
      - internal/plugins/git.go
      - internal/plugins/git_test.go
      - pkg/release/release.go

verification:
  - step: All tests pass
    command: make test
    expected: All tests pass

  - step: Build binary
    command: make build
    expected: Binary exists in bin/big-release

  - step: Lint
    command: make lint
    expected: No lint errors
