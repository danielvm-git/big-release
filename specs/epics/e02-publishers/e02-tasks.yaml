tasks:
  - id: e02s01-impl
    story: e02s01
    description: Implement and test PyPI publisher
    risk: P1
    security: low
    status: done
    steps:
      - step: 1
        description: "Create PyPI publisher struct with Name(), Detect(), Prepare(), Publish(), Verify()"
        verify: "go build ./internal/publishers/pypi/..."
      - step: 2
        description: "Write unit tests for PyPI publisher (Name, Detect, Prepare, env validation, auto-registration)"
        verify: "go test -count=1 -run 'TestPyPI' ./internal/publishers/pypi/..."
      - step: 3
        description: "Write integration tests for PyPI publisher (HTTP mocks: 200, 401, 403, 404, 5xx, 429 retry, dry-run)"
        verify: "go test -count=1 -run 'TestPyPI' -v ./internal/publishers/pypi/..."

