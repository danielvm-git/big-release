bugs:
  - id: BUG-cli-hardening
    status: fixed
    severity: high
    scope: cmd
    title: Three CLI hardening bugs (compile blocker, swallowed errors, dry-run dead)
    approach: |
      Created missing pkg/release package with full orchestrator.
      Added error printing before os.Exit(1) in main.go.
      Added SetDryRun to Publisher interface and implemented on all 8 publishers.
    risk_level: low
    files_changed:
      - cmd/big-release/main.go
      - go.mod
      - internal/plugins/github.go
      - internal/publishers/base.go
      - internal/publishers/crates/crates.go
      - internal/publishers/godot/godot.go
      - internal/publishers/goproxy/goproxy.go
      - internal/publishers/maven/maven.go
      - internal/publishers/npm/npm.go
      - internal/publishers/packagist/packagist.go
      - internal/publishers/pypi/pypi.go
      - internal/publishers/swift/swift.go
      - pkg/release/release.go
      - pkg/release/release_test.go
    commit_message: "fix(cmd): harden CLI error handling, publisher dry-run, and missing orchestrator package"

  - id: BUG-version-calc
    status: fixed
    severity: high
    scope: pkg/release
    title: Version calculator not wired into orchestrator
    approach: |
      Calculator.CalculateNextVersion exists but is never called.
      ctx.NextRelease.Version is always empty string.
      Fix: call calculator in orchestrator after AnalyzeCommits.
    risk_level: low
    files_changed:
      - pkg/release/release.go
    commit_message: "fix(release): wire version calculator into orchestrator lifecycle"

  - id: BUG-branch-validation
    status: fixed
    severity: medium
    scope: pkg/release
    title: Branch validation never checked in orchestrator
    approach: |
      config.Branches defined but orchestrator never validates
      current branch against it. Fix: check branch before proceeding.
    risk_level: low
    files_changed:
      - pkg/release/release.go
    commit_message: "fix(release): validate current branch against config.Branches"

  - id: BUG-nil-panic-analyzer
    status: fixed
    severity: critical
    scope: release-pipeline
    title: Nil pointer panic in ChangelogPlugin + unused Analyzer
    approach: |
      1. resolveNotes() panicked on nil NextRelease — added nil guard.
      2. algorithm.Analyzer existed but was never called — wired as Phase 2 fallback.
      3. Added early exit when no release type detected.
    risk_level: low
    files_changed:
      - internal/plugins/changelog.go
      - pkg/release/release.go
      - internal/plugins/changelog_test.go
      - pkg/release/release_test.go
    commit_message: "fix(release): wire Analyzer fallback and nil guard in resolveNotes"
    source: "https://github.com/danielvm-git/big-release/issues/6"
