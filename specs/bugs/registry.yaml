  - id: BUG-crates-retry-empty-body
    status: fixed
    severity: high
    scope: internal/publishers/crates
    title: Crates publish body not rewindable on HTTP 429 retry
    approach: |
      Changed from passing *bytes.Buffer directly to http.NewRequest (which
      consumes the buffer on first Do()) to bytes.NewReader(body.Bytes()),
      which implements io.Seeker and allows RetryClient to rewind on retry.
    risk_level: low
    files_changed:
      - internal/publishers/crates/crates.go
    commit_message: "fix(crates): use bytes.NewReader for retry-safe request body"

