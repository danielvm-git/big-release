    risk_level: low
    files_changed:
      - internal/publishers/crates/crates.go
    commit_message: "fix(crates): use bytes.NewReader for retry-safe request body"

  - id: BUG-pypi-retry-body-empty
    status: fixed
    severity: high
    scope: internal/publishers/pypi
    title: PyPI *bytes.Buffer body not rewindable on HTTP 429 retry
    approach: |
      Changed from passing &buf to bytes.NewReader(buf.Bytes()) so the
      RetryClient can rewind the body on 429 retry.
    risk_level: low
    files_changed:
      - internal/publishers/pypi/pypi.go
    commit_message: "fix(pypi): use bytes.NewReader for retry-safe request body"

  - id: BUG-exec-shellsplit-panic
    status: fixed
    severity: high
    scope: internal/plugins
    title: shellSplit returns empty slice causing index-out-of-range panic
    approach: |
      Added len(parts) == 0 guard in runCommand before accessing parts[0].
      Returns a descriptive error instead of panicking.
    risk_level: low
    files_changed:
      - internal/plugins/exec.go
    commit_message: "fix(exec): guard against empty shellSplit result"

