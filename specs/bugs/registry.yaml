bugs:
  - id: BUG-tag-ignores-tagformat
    status: fixed
    severity: high
    scope: internal/plugins, internal/git
    title: git plugin's CreateTag ignores tagFormat, breaking every second release with a non-default prefix
    approach: |
      Added git.FormatTag(tagFormat, version) as the single shared source of truth for
      turning a semver version into a tag name, used by both the read path
      (GetLastRelease, unchanged) and the write path (GitPlugin.createTag/deleteTag,
      GitHubPlugin.buildReleasePayload's TagName). Default release display name keeps
      its existing hardcoded "v{version}" convention (cosmetic, independent of the
      actual tag) per TestGitHubPluginPublish_DefaultNameTemplatePreservesVPrefix.
    risk_level: low
    files_changed:
      - internal/git/client.go
      - internal/plugins/git.go
      - internal/plugins/git_test.go
      - internal/plugins/github.go
    commit_message: "fix(release): apply tagFormat when creating git tags, not just when reading them"

  - id: BUG-cli-hardening
    status: fixed
    severity: high
    scope: cmd
    title: Three CLI hardening bugs (compile blocker, swallowed errors, dry-run dead)
    approach: |
      Created missing pkg/release package with full orchestrator.
      Added error printing before os.Exit(1) in main.go.
      Added SetDryRun to Publisher interface and implemented on all 8 publishers.
    risk_level: low
    files_changed:
      - cmd/big-release/main.go
      - go.mod
      - internal/plugins/github.go
      - internal/publishers/base.go
      - internal/publishers/crates/crates.go
      - internal/publishers/godot/godot.go
      - internal/publishers/goproxy/goproxy.go
      - internal/publishers/maven/maven.go
      - internal/publishers/npm/npm.go
      - internal/publishers/packagist/packagist.go
      - internal/publishers/pypi/pypi.go
      - internal/publishers/swift/swift.go
      - pkg/release/release.go
      - pkg/release/release_test.go
    commit_message: "fix(cmd): harden CLI error handling, publisher dry-run, and missing orchestrator package"

  - id: BUG-version-calc
    status: fixed
    severity: high
    scope: pkg/release
    title: Version calculator not wired into orchestrator
    approach: |
      Calculator.CalculateNextVersion exists but is never called.
      ctx.NextRelease.Version is always empty string.
      Fix: call calculator in orchestrator after AnalyzeCommits.
    risk_level: low
    files_changed:
      - pkg/release/release.go
    commit_message: "fix(release): wire version calculator into orchestrator lifecycle"

  - id: BUG-branch-validation
    status: fixed
    severity: medium
    scope: pkg/release
    title: Branch validation never checked in orchestrator
    approach: |
      config.Branches defined but orchestrator never validates
      current branch against it. Fix: check branch before proceeding.
    risk_level: low
    files_changed:
      - pkg/release/release.go
    commit_message: "fix(release): validate current branch against config.Branches"

  - id: BUG-nil-panic-analyzer
    status: fixed
    severity: critical
    scope: release-pipeline
    title: Nil pointer panic in ChangelogPlugin + unused Analyzer
    approach: |
      1. resolveNotes() panicked on nil NextRelease — added nil guard.
      2. algorithm.Analyzer existed but was never called — wired as Phase 2 fallback.
      3. Added early exit when no release type detected.
    risk_level: low
    files_changed:
      - internal/plugins/changelog.go
      - pkg/release/release.go
      - internal/plugins/changelog_test.go
      - pkg/release/release_test.go
    commit_message: "fix(release): wire Analyzer fallback and nil guard in resolveNotes"
    source: "https://github.com/danielvm-git/big-release/issues/6"

  - id: BUG-ci-binary-missing
    status: fixed
    severity: high
    scope: ci
    title: Release workflow missing cross-platform binaries
    approach: Cross-compile matrix in Makefile; upload bin/big-release-{os}-{arch} in release.yml (#30)
    commit_message: "fix(ci): ship platform binaries and bump checkout to v7"

  - id: BUG-gha-versions
    status: fixed
    severity: low
    scope: ci
    title: Outdated actions/checkout@v4 in workflows
    approach: Folded into BUG-ci-binary-missing PR; bumped to checkout@v7 (#30)
    commit_message: "fix(ci): ship platform binaries and bump checkout to v7"

  - id: BUG-pr-detection
    status: fixed
    severity: medium
    scope: pkg/release
    title: Release runs on pull request CI builds
    approach: detectPR() skips release with log for GitHub/GitLab/Azure PR env vars (#33)
    commit_message: "fix(release): skip release on pull request CI builds"

  - id: BUG-changelog-format
    status: fixed
    severity: high
    scope: plugins
    title: Changelog format not Keep-a-Changelog 1.1.0
    approach: Rewrote generator and changelog plugin for Added/Fixed/Changed/Removed sections (#32)
    commit_message: "fix(changelog): Keep-a-Changelog 1.1.0 format and configurable title"

  - id: BUG-changelog-title
    status: fixed
    severity: low
    scope: plugins
    title: Non-configurable CHANGELOG title
    approach: Absorbed into BUG-changelog-format; configurable changelogTitle (#32)
    commit_message: "fix(changelog): Keep-a-Changelog 1.1.0 format and configurable title"

  - id: BUG-branch-validation-gaps
    status: fixed
    severity: low
    scope: config
    title: Duplicate branch names not rejected in ValidateConfig
    approach: Added duplicate-name check in config.ValidateConfig (#29)
    commit_message: "fix(config): reject duplicate branch names in ValidateConfig"

  - id: BUG-push-fails-silently
    status: fixed
    severity: high
    scope: internal/plugins, internal/git, ci
    title: Git push fails silently in CI — tags never pushed to remote
    approach: |
      pushRefs() now pushes tags FIRST, then commits. If tag push fails,
      the error is returned. If commit push fails (no new commits or
      branch protection), it's logged but not fatal. Also surfaced
      git stderr in error messages.
    risk_level: low
    files_changed:
      - internal/plugins/git.go
      - internal/git/client.go
    commit_message: "fix(git): push tags independently of commit push"
    source: "https://github.com/danielvm-git/big-release/actions/runs/30146351433/job/89650041613"
    fixed_in: "4e77fed, bb3c0cb"
    verified: "2026-07-25"

  - id: BUG-branch-config-dead
    status: fixed
    severity: high
    scope: pkg/release
    title: Branch config Type/Channel/Prerelease never propagated to algorithm layer
    approach: |
      Added mapBranchConfig() function that copies Type, Channel, and
      Prerelease from BranchConfig to algorithm.Branch.
    risk_level: low
    files_changed:
      - pkg/release/release.go
    commit_message: "fix(release): propagate branch config Type/Channel/Prerelease"
    verified: "2026-07-25"

  - id: BUG-publishers-config-ignored
    status: fixed
    severity: medium
    scope: pkg/release
    title: Config publishers.enabled flag silently ignored — detection is file-based only
    approach: |
      Added filter in runPublishers() to skip publishers with enabled: false
      in config. Detected publishers not in config still run (backward compatible).
    risk_level: low
    files_changed:
      - pkg/release/release.go
    commit_message: "fix(release): filter publishers against config.Enabled flag"
    verified: "2026-07-25"

  - id: BUG-release-workflow-softprops-and-verbose
    status: fixed
    severity: high
    scope: ci
    title: "Release workflow: softprops upload fails on missing tag, and --verbose emits no output"
    approach: |
      1. Removed softprops/action-gh-release step (redundant with github plugin)
      2. Added buildLogger() with zap.NewDevelopmentConfig() for verbose mode
      3. Added success-path Info logs in release.go
    risk_level: low
    files_changed:
      - .github/workflows/test-build-release.yml
      - cmd/big-release/main.go
      - pkg/release/release.go
    commit_message: "fix(ci): remove softprops, improve verbose logging"
    verified: "2026-07-25"

  # --- QA Audit 2026-07-30: 14 new bugs found and fixed ---

  - id: BUG-crates-empty-body-publish
    status: fixed
    severity: critical
    scope: internal/publishers/crates
    title: Crates publisher sends PUT with empty body — crates.io requires tar.gz content
    approach: |
      Added buildUploadBody() that creates a minimal tar.gz archive containing
      Cargo.toml and a placeholder src/lib.rs. Added Content-Type: application/gzip header.
    risk_level: low
    files_changed:
      - internal/publishers/crates/crates.go
    commit_message: "fix(crates): send tar.gz body in publish request"

  - id: BUG-maven-empty-body-publish
    status: fixed
    severity: critical
    scope: internal/publishers/maven
    title: Maven publisher sends POST with empty body — Maven Central requires POM content
    approach: |
      Now reads pom.xml and sends it as the request body with Content-Type: application/xml.
    risk_level: low
    files_changed:
      - internal/publishers/maven/maven.go
    commit_message: "fix(maven): send pom.xml content in publish request"

  - id: BUG-packagist-wrong-update-url
    status: fixed
    severity: critical
    scope: internal/publishers/packagist
    title: Packagist sends API URL as repository URL instead of git repo URL
    approach: |
      Added resolveRepositoryURL() that uses GITHUB_REPOSITORY env var or
      git remote origin URL instead of the Packagist API URL.
    risk_level: low
    files_changed:
      - internal/publishers/packagist/packagist.go
    commit_message: "fix(packagist): use git repo URL in update request"

  - id: BUG-godot-hardcoded-v-prefix
    status: fixed
    severity: high
    scope: internal/publishers/godot
    title: Godot hardcodes "v" prefix in tag, ignoring tagFormat config
    approach: |
      Added resolveTag() that reads tagFormat from .big-release.yml config,
      falling back to "v" prefix for backward compatibility.
    risk_level: low
    files_changed:
      - internal/publishers/godot/godot.go
    commit_message: "fix(godot): respect tagFormat config for release tags"

  - id: BUG-swift-bypasses-tagformat
    status: fixed
    severity: high
    scope: internal/publishers/swift
    title: Swift publisher creates bare version tags, bypassing FormatTag
    approach: |
      Added resolveTag() using git.FormatTag. Now creates annotated tags
      with -a flag and -m message instead of lightweight tags.
    risk_level: low
    files_changed:
      - internal/publishers/swift/swift.go
    commit_message: "fix(swift): use FormatTag for consistent tag naming"

  - id: BUG-changelog-duplicate-notes
    status: fixed
    severity: high
    scope: internal/plugins/changelog
    title: ChangelogPlugin.GenerateNotes returns already-set notes causing duplication
    approach: |
      Changed GenerateNotes to return empty string. The orchestrator owns
      note generation via algorithm.Generator; the changelog plugin only
      writes to CHANGELOG.md in Prepare().
    risk_level: low
    files_changed:
      - internal/plugins/changelog.go
      - internal/plugins/changelog_test.go
    commit_message: "fix(changelog): stop duplicating notes from orchestrator"

  - id: BUG-calculator-maintenance-ignores-type
    status: fixed
    severity: medium
    scope: internal/algorithm/calculator
    title: Maintenance calculator always bumps patch regardless of release type
    approach: |
      Added switch on releaseType: major bumps major, minor bumps minor,
      patch (default) bumps patch within same major.minor.
    risk_level: low
    files_changed:
      - internal/algorithm/calculator.go
    commit_message: "fix(algorithm): respect release type in maintenance version calc"

  - id: BUG-pypi-defer-in-loop
    status: fixed
    severity: medium
    scope: internal/publishers/pypi
    title: PyPI publisher defers file close inside loop — handles leak until function return
    approach: |
      Extracted addDistFile() method with proper defer scope. Each file
      is opened, copied, and closed within the method call.
    risk_level: low
    files_changed:
      - internal/publishers/pypi/pypi.go
    commit_message: "fix(pypi): close dist files immediately in loop"

  - id: BUG-git-register-global-side-effect
    status: fixed
    severity: medium
    scope: pkg/release
    title: Git plugin registers globally on every orchestrator run
    approach: |
      Added guard: only call plugins.Register if "git" plugin is not
      already present in the registry.
    risk_level: low
    files_changed:
      - pkg/release/release.go
    commit_message: "fix(release): guard git plugin registration"

  - id: BUG-config-parent-traversal-unbounded
    status: fixed
    severity: medium
    scope: internal/config
    title: Config file search traverses parent directories without depth limit
    approach: |
      Added maxDepth=10 limit to the parent directory traversal loop.
    risk_level: low
    files_changed:
      - internal/config/config.go
    commit_message: "fix(config): limit config file search to 10 parent levels"

  - id: BUG-default-publishers-incomplete
    status: fixed
    severity: medium
    scope: internal/config
    title: Default config only enables 4 of 9 publishers
    approach: |
      Added all 9 publishers (npm, pypi, crates, goproxy, maven, packagist,
      swift, godot, pnpm) to the default config.
    risk_level: low
    files_changed:
      - internal/config/config.go
    commit_message: "fix(config): enable all publishers in default config"

  - id: BUG-writeStepOutput-permissions
    status: fixed
    severity: low
    scope: pkg/release
    title: GITHUB_OUTPUT file created with 0644 instead of 0600
    approach: Changed file permissions from 0644 to 0600.
    risk_level: low
    files_changed:
      - pkg/release/release.go
    commit_message: "fix(release): use restrictive permissions for GITHUB_OUTPUT"

  - id: BUG-health-degraded-exit-error
    status: fixed
    severity: low
    scope: cmd
    title: Health command returns error on degraded status
    approach: |
      Changed to return nil on degraded status. Degraded means some optional
      tools are missing but core system works; should not fail CI.
    risk_level: low
    files_changed:
      - cmd/big-release/main.go
    commit_message: "fix(cli): health check returns nil on degraded status"

  # --- QA Audit 2026-07-30 (round 2): 8 new bugs found and fixed ---

  - id: BUG-calculator-nil-branch
    status: fixed
    severity: critical
    scope: internal/algorithm
    title: CalculateNextVersion panics on nil branch when lastRelease is non-nil
    approach: |
      Added nil guard before switch: if branch == nil, default to
      BranchTypeRelease. Defense-in-depth for public API callers.
    risk_level: low
    files_changed:
      - internal/algorithm/calculator.go
    commit_message: "fix(algorithm): guard against nil branch in CalculateNextVersion"

  - id: BUG-calculator-nil-baseversion
    status: fixed
    severity: critical
    scope: internal/algorithm
    title: calculatePrerelease panics on nil baseVersion when releaseType unrecognized
    approach: |
      Added default case to switch that returns an error, matching
      calculateRegular's pattern. Without it, baseVersion stays nil
      and .String() panics.
    risk_level: low
    files_changed:
      - internal/algorithm/calculator.go
    commit_message: "fix(algorithm): add default case to prerelease switch"

  - id: BUG-godot-verify-hardcoded-v
    status: fixed
    severity: high
    scope: internal/publishers/godot
    title: Godot Verify hardcodes v prefix in URL, ignoring tagFormat
    approach: |
      Verify now calls resolveTag(version) to build the tag, matching
      Publish. Previously hardcoded v%s in the releases/tags/ URL.
    risk_level: low
    files_changed:
      - internal/publishers/godot/godot.go
    commit_message: "fix(godot): use resolveTag in Verify to match Publish"

  - id: BUG-swift-verify-bare-version
    status: fixed
    severity: high
    scope: internal/publishers/swift
    title: Swift Verify uses bare version, ignoring tagFormat
    approach: |
      Verify now calls resolveTag(version) to build the tag, matching
      Publish. Previously used bare version for git tag -l lookup.
    risk_level: low
    files_changed:
      - internal/publishers/swift/swift.go
    commit_message: "fix(swift): use resolveTag in Verify to match Publish"

  - id: BUG-crates-retry-body-empty
    status: fixed
    severity: high
    scope: internal/publishers/crates
    title: Crates *bytes.Buffer body not rewindable on 429 retry
    approach: |
      Changed http.NewRequest body from *bytes.Buffer to
      bytes.NewReader(body.Bytes()). bytes.NewReader implements
      io.Seeker, allowing RetryClient to rewind on 429.
    risk_level: low
    files_changed:
      - internal/publishers/crates/crates.go
    commit_message: "fix(crates): use bytes.NewReader for retry-safe request body"

  - id: BUG-pypi-retry-body-empty
    status: fixed
    severity: high
    scope: internal/publishers/pypi
    title: PyPI *bytes.Buffer body not rewindable on 429 retry
    approach: |
      Changed http.NewRequest body from &buf to bytes.NewReader(buf.Bytes()).
      Same fix as BUG-crates-retry-body-empty.
    risk_level: low
    files_changed:
      - internal/publishers/pypi/pypi.go
    commit_message: "fix(pypi): use bytes.NewReader for retry-safe request body"

  - id: BUG-exec-shellsplit-panic
    status: fixed
    severity: high
    scope: internal/plugins
    title: shellSplit can return empty slice causing index-out-of-range panic
    approach: |
      Added len(parts) == 0 guard in runCommand before accessing
      parts[0]. Returns descriptive error instead of panicking.
    risk_level: low
    files_changed:
      - internal/plugins/exec.go
    commit_message: "fix(exec): guard against empty shellSplit result"

  # --- QA Audit Round 2 (2026-07-30): 7 new bugs found and fixed ---

  - id: BUG-calculator-nil-branch
    status: fixed
    severity: critical
    scope: internal/algorithm
    title: CalculateNextVersion panics on nil branch when lastRelease is non-nil
    approach: |
      Added nil guard before the switch on branch.Type:
      if branch == nil { branch = &Branch{Type: BranchTypeRelease} }
    risk_level: low
    files_changed:
      - internal/algorithm/calculator.go
    commit_message: "fix(algorithm): guard against nil branch in CalculateNextVersion"

  - id: BUG-calculator-nil-baseversion
    status: fixed
    severity: high
    scope: internal/algorithm
    title: calculatePrerelease panics on nil baseVersion when releaseType unrecognized
    approach: |
      Added default case to the switch that returns an error instead of
      leaving baseVersion nil, matching calculateRegular's pattern.
    risk_level: low
    files_changed:
      - internal/algorithm/calculator.go
    commit_message: "fix(algorithm): handle unrecognized releaseType in calculatePrerelease"

  - id: BUG-godot-verify-hardcoded-v
    status: fixed
    severity: high
    scope: internal/publishers/godot
    title: Godot Verify hardcodes v prefix in URL, ignores tagFormat
    approach: |
      Verify now calls p.resolveTag(version) to build the correct tag,
      matching what Publish uses. Previously hardcoded "v%s" in the URL.
    risk_level: low
    files_changed:
      - internal/publishers/godot/godot.go
    commit_message: "fix(godot): use resolveTag in Verify to match Publish"

  - id: BUG-swift-verify-bare-version
    status: fixed
    severity: high
    scope: internal/publishers/swift
    title: Swift Verify uses bare version instead of resolveTag
    approach: |
      Verify now calls p.resolveTag(version) to search for the correct
      tag, matching what Publish creates. Previously searched for bare
      version which never matched when tagFormat had a prefix.
    risk_level: low
    files_changed:
      - internal/publishers/swift/swift.go
    commit_message: "fix(swift): use resolveTag in Verify to match Publish"

  - id: BUG-crates-retry-body-empty
    status: fixed
    severity: high
    scope: internal/publishers/crates
    title: Crates *bytes.Buffer body not rewindable on 429 retry
    approach: |
      Changed from passing *bytes.Buffer directly to http.NewRequest
      to bytes.NewReader(body.Bytes()), which implements io.Seeker and
      allows RetryClient to rewind the body on retry.
    risk_level: low
    files_changed:
      - internal/publishers/crates/crates.go
    commit_message: "fix(crates): use bytes.NewReader for retry-safe request body"

  - id: BUG-pypi-retry-body-empty
    status: fixed
    severity: high
    scope: internal/publishers/pypi
    title: PyPI *bytes.Buffer body not rewindable on 429 retry
    approach: |
      Changed from &buf to bytes.NewReader(buf.Bytes()) for retry safety,
      matching the pattern used by maven, packagist, and godot publishers.
    risk_level: low
    files_changed:
      - internal/publishers/pypi/pypi.go
    commit_message: "fix(pypi): use bytes.NewReader for retry-safe request body"

  - id: BUG-exec-shellsplit-panic
    status: fixed
    severity: high
    scope: internal/plugins
    title: shellSplit can return empty slice causing index-out-of-range panic
    approach: |
      Added len(parts) == 0 guard in runCommand before accessing parts[0].
      Returns a descriptive error instead of panicking.
    risk_level: low
    files_changed:
      - internal/plugins/exec.go
    commit_message: "fix(exec): guard against empty shellSplit result"

