bugs:
  - id: BUG-tag-ignores-tagformat
    status: fixed
    severity: high
    scope: internal/plugins, internal/git
    title: git plugin's CreateTag ignores tagFormat, breaking every second release with a non-default prefix
    approach: |
      Added git.FormatTag(tagFormat, version) as the single shared source of truth for
      turning a semver version into a tag name, used by both the read path
      (GetLastRelease, unchanged) and the write path (GitPlugin.createTag/deleteTag,
      GitHubPlugin.buildReleasePayload's TagName). Default release display name keeps
      its existing hardcoded "v{version}" convention (cosmetic, independent of the
      actual tag) per TestGitHubPluginPublish_DefaultNameTemplatePreservesVPrefix.
    risk_level: low
    files_changed:
      - internal/git/client.go
      - internal/plugins/git.go
      - internal/plugins/git_test.go
      - internal/plugins/github.go
    commit_message: "fix(release): apply tagFormat when creating git tags, not just when reading them"

  - id: BUG-cli-hardening
    status: fixed
    severity: high
    scope: cmd
    title: Three CLI hardening bugs (compile blocker, swallowed errors, dry-run dead)
    approach: |
      Created missing pkg/release package with full orchestrator.
      Added error printing before os.Exit(1) in main.go.
      Added SetDryRun to Publisher interface and implemented on all 8 publishers.
    risk_level: low
    files_changed:
      - cmd/big-release/main.go
      - go.mod
      - internal/plugins/github.go
      - internal/publishers/base.go
      - internal/publishers/crates/crates.go
      - internal/publishers/godot/godot.go
      - internal/publishers/goproxy/goproxy.go
      - internal/publishers/maven/maven.go
      - internal/publishers/npm/npm.go
      - internal/publishers/packagist/packagist.go
      - internal/publishers/pypi/pypi.go
      - internal/publishers/swift/swift.go
      - pkg/release/release.go
      - pkg/release/release_test.go
    commit_message: "fix(cmd): harden CLI error handling, publisher dry-run, and missing orchestrator package"

  - id: BUG-version-calc
    status: fixed
    severity: high
    scope: pkg/release
    title: Version calculator not wired into orchestrator
    approach: |
      Calculator.CalculateNextVersion exists but is never called.
      ctx.NextRelease.Version is always empty string.
      Fix: call calculator in orchestrator after AnalyzeCommits.
    risk_level: low
    files_changed:
      - pkg/release/release.go
    commit_message: "fix(release): wire version calculator into orchestrator lifecycle"

  - id: BUG-branch-validation
    status: fixed
    severity: medium
    scope: pkg/release
    title: Branch validation never checked in orchestrator
    approach: |
      config.Branches defined but orchestrator never validates
      current branch against it. Fix: check branch before proceeding.
    risk_level: low
    files_changed:
      - pkg/release/release.go
    commit_message: "fix(release): validate current branch against config.Branches"

  - id: BUG-nil-panic-analyzer
    status: fixed
    severity: critical
    scope: release-pipeline
    title: Nil pointer panic in ChangelogPlugin + unused Analyzer
    approach: |
      1. resolveNotes() panicked on nil NextRelease — added nil guard.
      2. algorithm.Analyzer existed but was never called — wired as Phase 2 fallback.
      3. Added early exit when no release type detected.
    risk_level: low
    files_changed:
      - internal/plugins/changelog.go
      - pkg/release/release.go
      - internal/plugins/changelog_test.go
      - pkg/release/release_test.go
    commit_message: "fix(release): wire Analyzer fallback and nil guard in resolveNotes"
    source: "https://github.com/danielvm-git/big-release/issues/6"

  - id: BUG-ci-binary-missing
    status: fixed
    severity: high
    scope: ci
    title: Release workflow missing cross-platform binaries
    approach: Cross-compile matrix in Makefile; upload bin/big-release-{os}-{arch} in release.yml (#30)
    commit_message: "fix(ci): ship platform binaries and bump checkout to v7"

  - id: BUG-gha-versions
    status: fixed
    severity: low
    scope: ci
    title: Outdated actions/checkout@v4 in workflows
    approach: Folded into BUG-ci-binary-missing PR; bumped to checkout@v7 (#30)
    commit_message: "fix(ci): ship platform binaries and bump checkout to v7"

  - id: BUG-pr-detection
    status: fixed
    severity: medium
    scope: pkg/release
    title: Release runs on pull request CI builds
    approach: detectPR() skips release with log for GitHub/GitLab/Azure PR env vars (#33)
    commit_message: "fix(release): skip release on pull request CI builds"

  - id: BUG-changelog-format
    status: fixed
    severity: high
    scope: plugins
    title: Changelog format not Keep-a-Changelog 1.1.0
    approach: Rewrote generator and changelog plugin for Added/Fixed/Changed/Removed sections (#32)
    commit_message: "fix(changelog): Keep-a-Changelog 1.1.0 format and configurable title"

  - id: BUG-changelog-title
    status: fixed
    severity: low
    scope: plugins
    title: Non-configurable CHANGELOG title
    approach: Absorbed into BUG-changelog-format; configurable changelogTitle (#32)
    commit_message: "fix(changelog): Keep-a-Changelog 1.1.0 format and configurable title"

  - id: BUG-branch-validation-gaps
    status: fixed
    severity: low
    scope: config
    title: Duplicate branch names not rejected in ValidateConfig
    approach: Added duplicate-name check in config.ValidateConfig (#29)
    commit_message: "fix(config): reject duplicate branch names in ValidateConfig"

  - id: BUG-push-fails-silently
    status: fixed
    severity: high
    scope: internal/plugins, internal/git, ci
    title: Git push fails silently in CI — tags never pushed to remote
    approach: |
      pushRefs() now pushes tags FIRST, then commits. If tag push fails,
      the error is returned. If commit push fails (no new commits or
      branch protection), it's logged but not fatal. Also surfaced
      git stderr in error messages.
    risk_level: low
    files_changed:
      - internal/plugins/git.go
      - internal/git/client.go
    commit_message: "fix(git): push tags independently of commit push"
    source: "https://github.com/danielvm-git/big-release/actions/runs/30146351433/job/89650041613"
    fixed_in: "4e77fed, bb3c0cb"
    verified: "2026-07-25"

  - id: BUG-branch-config-dead
    status: fixed
    severity: high
    scope: pkg/release
    title: Branch config Type/Channel/Prerelease never propagated to algorithm layer
    approach: |
      Added mapBranchConfig() function that copies Type, Channel, and
      Prerelease from BranchConfig to algorithm.Branch.
    risk_level: low
    files_changed:
      - pkg/release/release.go
    commit_message: "fix(release): propagate branch config Type/Channel/Prerelease"
    verified: "2026-07-25"

  - id: BUG-publishers-config-ignored
    status: fixed
    severity: medium
    scope: pkg/release
    title: Config publishers.enabled flag silently ignored — detection is file-based only
    approach: |
      Added filter in runPublishers() to skip publishers with enabled: false
      in config. Detected publishers not in config still run (backward compatible).
    risk_level: low
    files_changed:
      - pkg/release/release.go
    commit_message: "fix(release): filter publishers against config.Enabled flag"
    verified: "2026-07-25"

  - id: BUG-release-workflow-softprops-and-verbose
    status: fixed
    severity: high
    scope: ci
    title: "Release workflow: softprops upload fails on missing tag, and --verbose emits no output"
    approach: |
      1. Removed softprops/action-gh-release step (redundant with github plugin)
      2. Added buildLogger() with zap.NewDevelopmentConfig() for verbose mode
      3. Added success-path Info logs in release.go
    risk_level: low
    files_changed:
      - .github/workflows/test-build-release.yml
      - cmd/big-release/main.go
      - pkg/release/release.go
    commit_message: "fix(ci): remove softprops, improve verbose logging"
    verified: "2026-07-25"
