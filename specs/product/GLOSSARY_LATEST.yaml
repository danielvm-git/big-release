glossary:
  - term: big-release
    definition: The unified release tool being built in this repo.
  - term: publisher
    definition: Language-specific module that handles package publishing (e.g., npm, PyPI).
  - term: plugin
    definition: Extension point for additional functionality (e.g., changelog generation).
  - term: preflight
    definition: Full local verification stack (lint + test + build) that must pass before forward work.
  - term: conventional commits
    definition: Commit message format: type(scope): description. Drives version calculation.
