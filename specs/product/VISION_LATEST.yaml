vision:
  statement: >
    A unified, multi-language release tool that determines version,
    generates changelog, and publishes packages across all languages
    from a single binary.
  goals:
    - Single binary distribution (Go)
    - Support 8+ language ecosystems (npm, PyPI, crates.io, Go, Packagist, Maven, Swift, Godot)
    - Port core algorithm from semantic-release (Node.js)
    - Plugin system for extensibility
    - 35+ portfolio repos will consume this tool
