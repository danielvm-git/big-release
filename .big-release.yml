# big-release configuration
# Tags in this repo use format "2.0.0" (no "v" prefix)
tagFormat: "${version}"
initialVersion: "0.1.0"

# Publish release binaries as GitHub release assets via the github plugin
# (mirrors @semantic-release/github: release + asset upload via the REST API,
# replacing the redundant softprops/action-gh-release workflow step).
#
# No `changelog` plugin: release notes are generated by the core algorithm
# Generator regardless (state.NextRelease.Notes) and shown on GitHub Releases
# via the github plugin. Committing CHANGELOG.md to `main` would need the git
# plugin to push a new commit to a protected branch — GitHub rejects that
# outright for any non-admin pusher (GH006), same as semantic-release's
# @semantic-release/git requires separate branch-protection accommodation.
# Staying off that path keeps big-release installable with zero GitHub
# configuration (see specs/bugs/BUG-git-push-error-swallowed.md).
plugins:
  - git
  - github
pluginConfigs:
  github:
    assets:
      - path: bin/big-release-linux-amd64
      - path: bin/big-release-darwin-amd64
      - path: bin/big-release-darwin-arm64
      - path: bin/big-release-windows-amd64.exe
