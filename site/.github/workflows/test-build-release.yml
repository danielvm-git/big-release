name: Test Build Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.22'
  APP_TYPE: go
  SITE_URL: "https://release.bigbase.click"

jobs:
  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8

  test:
    needs: [lint]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache: true

      - name: Check Conventional Commits
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          git log origin/main..HEAD --format="%s" | while read -r line; do
            if echo "$line" | grep -qE "^Merge "; then
              continue
            fi
            if ! echo "$line" | grep -qE "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: "; then
              echo "FAIL: Non-conventional commit: $line"
              exit 1
            fi
          done
          echo "PASS: All commits follow Conventional Commits"

      - name: Check no AI agent attribution
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          if git log origin/main..HEAD --format="%B" | grep -qiE '^co[- ]authored[- ]by:'; then
            echo "FAIL: Co-authored-by: footer found — blocked by CONVENTIONS.md"
            exit 1
          fi
          echo "PASS: No AI agent attribution"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -timeout 120s

  build:
    needs: [test]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache: true

      - name: Build
        run: go build ./...

      - name: Write deploy-meta
        run: |
          jq -n \
            --arg sha "${{ github.sha }}" \
            --arg ref "${{ github.ref_name }}" \
            --arg app_type "${{ env.APP_TYPE }}" \
            '{sha: $sha, ref: $ref, app_type: $app_type}' > deploy-meta.json

      - name: Upload deploy-meta artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-meta
          path: deploy-meta.json
          retention-days: 3

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install big-release
        run: |
          curl -sL https://github.com/danielvm-git/big-release/releases/latest/download/big-release-linux-amd64 -o big-release
          chmod +x big-release
          sudo mv big-release /usr/local/bin/
          big-release --version

      - name: Run big-release
        id: big-release
        run: big-release release --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: big-release-bot
          GIT_AUTHOR_EMAIL: big-release-bot@danielvm-git.github.io
          GIT_COMMITTER_NAME: big-release-bot
          GIT_COMMITTER_EMAIL: big-release-bot@danielvm-git.github.io

      - name: Update VERSION file
        run: |
          LATEST_TAG="$(git describe --tags --abbrev=0 2>/dev/null)"
          if [ -z "$LATEST_TAG" ]; then
            echo "No tags found, skipping VERSION update"
            exit 0
          fi
          VERSION="${LATEST_TAG#v}"
          CURRENT="$(cat VERSION 2>/dev/null || echo '')"
          if [ "$VERSION" = "$CURRENT" ]; then
            echo "VERSION already at $VERSION, no update needed"
            exit 0
          fi
          echo "$VERSION" > VERSION
          git add VERSION
          git -c user.name="big-release-bot" \
             -c user.email="big-release-bot@danielvm-git.github.io" \
             commit -m "chore: update VERSION to ${VERSION} [skip ci]"
          git push
