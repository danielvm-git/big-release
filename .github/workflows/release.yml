name: Release
# version: 1.0.0 — see workflow-templates/CHANGELOG.md

on:
  push:
    branches: [main, next, 'N.x', beta, alpha]

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.26'

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -timeout 120s

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest

  verify:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest

      - name: Preflight
        run: |
          if [ -f scripts/preflight.sh ]; then
            bash scripts/preflight.sh
          elif [ -f Makefile ] && grep -q '^preflight:' Makefile; then
            make preflight
          else
            echo "WARN: No preflight script found"
          fi

      - name: Check Conventional Commits
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
          git log "$LAST_TAG"..HEAD --format="%s" | while read -r line; do
            if ! echo "$line" | grep -qE "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: "; then
              echo "FAIL: Non-conventional commit: $line"
              exit 1
            fi
          done
          echo "PASS: All commits follow Conventional Commits"

      - name: Check no AI agent attribution
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
          if git log "$LAST_TAG"..HEAD --format="%B" | grep -qiE '^co[- ]authored[- ]by:'; then
            echo "FAIL: Co-authored-by: footer found — blocked by CONVENTIONS.md"
            exit 1
          fi
          echo "PASS: No AI agent attribution"

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [ci, lint, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-go@v5
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache: true

      - name: Check tag exists
        id: check-tag
        run: |
          if git describe --exact-match --tags HEAD >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag found on this commit, proceeding with release."
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
            echo "No tag on this commit, skipping release."
          fi

      - name: Build host binary
        if: steps.check-tag.outputs.tag_exists == 'true'
        run: make build

      - name: Cross-compile release assets
        if: steps.check-tag.outputs.tag_exists == 'true'
        run: make release

      - name: Install big-release
        if: steps.check-tag.outputs.tag_exists == 'true'
        run: |
          sudo cp bin/big-release /usr/local/bin/
          big-release --version

      - name: Run big-release
        if: steps.check-tag.outputs.tag_exists == 'true'
        run: big-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
          CARGO_TOKEN: ${{ secrets.CARGO_TOKEN }}

      - name: Upload release artifacts
        if: steps.check-tag.outputs.tag_exists == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            bin/big-release-linux-amd64
            bin/big-release-darwin-amd64
            bin/big-release-darwin-arm64
            bin/big-release-windows-amd64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
