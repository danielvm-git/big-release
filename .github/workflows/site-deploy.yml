name: Site Deploy

# Runs after "Site Test Build Release" passes on main. The site is one static
# page (site/index.html; site/main.go only embedded it for BigBase), so it is
# published to Cloudflare Pages from the exact commit that passed.

on:
  workflow_run:
    workflows: ["Site Test Build Release"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-site-production
  cancel-in-progress: false

jobs:
  package:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Collect the static files
        run: mkdir -p out && cp site/index.html out/

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: out/
          retention-days: 3

  deploy:
    needs: [package]
    permissions:
      contents: read
    uses: danielvm-git/.github/.github/workflows/deploy-cloudflare-pages.yml@0dc0feae39d0bb932a0999ee4f8dde35fb1b702d # danielvm-git/.github main (#46)
    with:
      project: danielvm-release
      domain: release.danielvm.net
    secrets: inherit
